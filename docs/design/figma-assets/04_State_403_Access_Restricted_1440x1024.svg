<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#F8FAFC; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Full Background -->
  <rect width="1440" height="1024" fill="#F8FAFC"/>

  <!-- Top Header Shell (Muted) -->
  <rect x="0" y="0" width="1440" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  <g transform="translate(32, 16)">
    <rect width="32" height="32" rx="8" fill="#1D4ED8"/>
    <path d="M16 8V24M8 16H24" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <text x="44" y="22" font-size="16" font-weight="700" fill="#0F172A">Hospital AI OS</text>
  </g>

  <!-- Centered 403 Error Card -->
  <g transform="translate(470, 260)">
    <rect width="500" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Shield Access Restricted Icon -->
    <circle cx="250" cy="90" r="40" fill="#FEF2F2"/>
    <path d="M250 66L266 74V88C266 98 250 108 250 108C250 108 234 98 234 88V74L250 66Z" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M250 80V88M250 94V95" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Title & Description -->
    <text x="250" y="170" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">403 — Access Restricted</text>
    <text x="250" y="202" text-anchor="middle" font-size="14" font-weight="400" fill="#64748B">You do not have the required role or permission</text>
    <text x="250" y="224" text-anchor="middle" font-size="14" font-weight="400" fill="#64748B">to access this administrative module.</text>

    <!-- Role Scope Detail Box -->
    <rect x="60" y="254" width="380" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="80" y="278" font-size="12" font-weight="600" fill="#334155">Current Role: Nurse (Ward 4B)</text>
    <text x="80" y="294" font-size="11" font-weight="500" fill="#94A3B8">Target Resource: Staff Management &amp; Access Admin</text>

    <!-- Action Button -->
    <rect x="165" y="336" width="170" height="42" rx="8" fill="#1D4ED8"/>
    <text x="250" y="362" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">Return to Dashboard</text>
  </g>
</svg>

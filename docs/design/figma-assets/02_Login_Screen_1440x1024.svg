<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#F8FAFC; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="hero-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="login-shadow" x="-8" y="-4" width="112%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- =====================================================================
       LEFT BRAND & MISSION CONTROL PANEL (Width: 760px, Height: 1024px)
       ===================================================================== -->
  <rect width="760" height="1024" fill="url(#hero-gradient)"/>

  <!-- Subtle Medical Grid Background Lines -->
  <g opacity="0.06">
    <line x1="0" y1="200" x2="760" y2="200" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="400" x2="760" y2="400" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="600" x2="760" y2="600" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="800" x2="760" y2="800" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="1024" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="1024" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="1024" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Brand Content (Left) -->
  <g transform="translate(80, 80)">
    <!-- Brand Logo -->
    <rect width="48" height="48" rx="12" fill="#2563EB"/>
    <path d="M24 14V34M14 24H34" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="5" fill="#FFFFFF"/>
    <circle cx="24" cy="24" r="2.5" fill="#2563EB"/>

    <text x="64" y="32" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="-0.02em">Hospital AI OS</text>
    <text x="64" y="48" font-size="12" font-weight="600" fill="#93C5FD" letter-spacing="0.08em">HEALTHCARE OPERATIONS PLATFORM</text>
  </g>

  <!-- Hero Statements (Left) -->
  <g transform="translate(80, 360)">
    <rect width="180" height="28" rx="14" fill="rgba(59, 130, 246, 0.2)" stroke="rgba(147, 197, 253, 0.3)" stroke-width="1"/>
    <text x="14" y="18" font-size="12" font-weight="600" fill="#93C5FD">ENTERPRISE CLINICAL OS</text>

    <text x="0" y="80" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="-0.03em">Intelligent operations</text>
    <text x="0" y="130" font-size="44" font-weight="700" fill="#93C5FD" letter-spacing="-0.03em">for modern care.</text>
    
    <text x="0" y="176" font-size="16" font-weight="400" fill="#CBD5E1" line-height="26">
      Unified mission control for physicians, nurses, labs, and administration.
    </text>
    <text x="0" y="202" font-size="16" font-weight="400" fill="#CBD5E1">
      Role-based security with assistive clinical AI grounding.
    </text>

    <!-- Operational Highlights -->
    <g transform="translate(0, 260)">
      <circle cx="10" cy="10" r="10" fill="rgba(34, 197, 94, 0.2)"/>
      <path d="M7 10L9 12L13 8" stroke="#4ADE80" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="15" font-size="14" font-weight="500" fill="#F8FAFC">7-Role Deterministic Access Control (RBAC)</text>

      <circle cx="10" cy="46" r="10" fill="rgba(59, 130, 246, 0.2)"/>
      <path d="M7 46L9 48L13 44" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="51" font-size="14" font-weight="500" fill="#F8FAFC">Deterministic Critical Value &amp; Panic Value Evaluator</text>

      <circle cx="10" cy="82" r="10" fill="rgba(168, 85, 247, 0.2)"/>
      <path d="M7 82L9 84L13 80" stroke="#C084FC" stroke-width="2" stroke-linecap="round"/>
      <text x="32" y="87" font-size="14" font-weight="500" fill="#F8FAFC">Assistive AI Documentation with Grounding Citations</text>
    </g>
  </g>

  <!-- Left Footer -->
  <g transform="translate(80, 940)">
    <text x="0" y="0" font-size="12" font-weight="500" fill="#94A3B8">Protected by Hospital AI OS Security Architecture • Audit Verified</text>
  </g>

  <!-- =====================================================================
       RIGHT LOGIN CARD CONTAINER (Width: 680px, Height: 1024px)
       ===================================================================== -->
  <g id="RightLoginPanel" transform="translate(760, 0)">
    <rect width="680" height="1024" fill="#F8FAFC"/>

    <!-- Centered Login Card (Width: 460px) -->
    <g transform="translate(110, 200)">
      <rect width="460" height="600" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#login-shadow)"/>
      
      <!-- Card Title & Subtitle -->
      <g transform="translate(40, 48)">
        <text x="0" y="0" font-size="24" font-weight="700" fill="#0F172A" letter-spacing="-0.01em">Staff Sign In</text>
        <text x="0" y="24" font-size="14" font-weight="400" fill="#64748B">Enter your hospital credentials to access your workspace.</text>
      </g>

      <!-- Form Inputs -->
      <g transform="translate(40, 110)">
        
        <!-- Field 1: Email Address -->
        <text x="0" y="0" font-size="13" font-weight="600" fill="#334155">Hospital Email Address</text>
        <rect x="0" y="10" width="380" height="44" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="14" y="37" font-size="14" font-weight="400" fill="#0F172A">sarah.chen@hospital.os</text>

        <!-- Field 2: Password -->
        <g transform="translate(0, 78)">
          <text x="0" y="0" font-size="13" font-weight="600" fill="#334155">Password</text>
          <text x="380" y="0" text-anchor="end" font-size="12" font-weight="600" fill="#2563EB">Forgot password?</text>
          
          <rect x="0" y="10" width="380" height="44" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
          <text x="14" y="38" font-size="16" font-weight="700" fill="#0F172A" letter-spacing="0.1em">••••••••••••••••</text>
          
          <!-- Password Hide/Show Eye Icon -->
          <circle cx="355" cy="32" r="7" stroke="#64748B" stroke-width="1.5"/>
          <circle cx="355" cy="32" r="2.5" fill="#64748B"/>
        </g>

        <!-- Remember Me Checkbox -->
        <g transform="translate(0, 172)">
          <rect x="0" y="0" width="18" height="18" rx="4" fill="#2563EB"/>
          <path d="M4 9L7 12L14 5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
          <text x="28" y="14" font-size="13" font-weight="500" fill="#475569">Remember this workstation for 12 hours</text>
        </g>

        <!-- Sign In Button -->
        <g transform="translate(0, 214)">
          <rect width="380" height="48" rx="8" fill="#1D4ED8"/>
          <text x="160" y="29" font-size="15" font-weight="600" fill="#FFFFFF">Sign In</text>
        </g>

        <!-- Security Statement -->
        <g transform="translate(0, 290)">
          <rect width="380" height="52" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
          <!-- Shield/Lock icon -->
          <path d="M22 18V24C22 28 17 31 17 31C17 31 12 28 12 24V18L17 16L22 18Z" stroke="#16A34A" stroke-width="1.5"/>
          <text x="36" y="24" font-size="11" font-weight="600" fill="#166534">End-to-End Encrypted Session</text>
          <text x="36" y="38" font-size="11" font-weight="400" fill="#64748B">RS256 Asymmetric Tokens • Rate Limited Protection</text>
        </g>
      </g>
    </g>
  </g>
</svg>

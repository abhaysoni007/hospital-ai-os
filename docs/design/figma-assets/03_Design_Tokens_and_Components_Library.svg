<svg width="1440" height="1024" viewBox="0 0 1440 1024" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#F8FAFC; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <!-- Background -->
  <rect width="1440" height="1024" fill="#F8FAFC"/>

  <!-- Page Title Header -->
  <g transform="translate(48, 40)">
    <text x="0" y="0" font-size="28" font-weight="700" fill="#0F172A">Hospital AI OS — Design Tokens &amp; Component System</text>
    <text x="0" y="24" font-size="14" font-weight="400" fill="#64748B">Production UI Foundation for Figma Variables &amp; Next.js Component Library</text>
  </g>

  <!-- =====================================================================
       SECTION 1: COLOR PALETTE & CLINICAL STATUSES (Top Left)
       ===================================================================== -->
  <g transform="translate(48, 100)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A">1. Semantic Color Tokens</text>
    
    <!-- Primary Indigo Range -->
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="40" height="40" rx="6" fill="#EFF6FF" stroke="#DBEAFE"/>
      <text x="4" y="52" font-size="10" font-weight="500" fill="#64748B">P-50</text>

      <rect x="48" y="0" width="40" height="40" rx="6" fill="#DBEAFE"/>
      <text x="52" y="52" font-size="10" font-weight="500" fill="#64748B">P-100</text>

      <rect x="96" y="0" width="40" height="40" rx="6" fill="#93C5FD"/>
      <text x="100" y="52" font-size="10" font-weight="500" fill="#64748B">P-300</text>

      <rect x="144" y="0" width="40" height="40" rx="6" fill="#2563EB"/>
      <text x="148" y="52" font-size="10" font-weight="500" fill="#64748B">P-500</text>

      <rect x="192" y="0" width="40" height="40" rx="6" fill="#1D4ED8"/>
      <text x="196" y="52" font-size="10" font-weight="700" fill="#1D4ED8">P-600 (Main)</text>

      <rect x="240" y="0" width="40" height="40" rx="6" fill="#1E3A8A"/>
      <text x="244" y="52" font-size="10" font-weight="500" fill="#64748B">P-800</text>

      <rect x="288" y="0" width="40" height="40" rx="6" fill="#0F172A"/>
      <text x="292" y="52" font-size="10" font-weight="500" fill="#64748B">P-950</text>
    </g>

    <!-- Clinical Statuses -->
    <g transform="translate(360, 16)">
      <!-- Critical -->
      <rect x="0" y="0" width="48" height="40" rx="6" fill="#DC2626"/>
      <text x="0" y="52" font-size="10" font-weight="700" fill="#DC2626">Critical</text>

      <!-- Urgent -->
      <rect x="56" y="0" width="48" height="40" rx="6" fill="#EA580C"/>
      <text x="56" y="52" font-size="10" font-weight="700" fill="#EA580C">Urgent</text>

      <!-- Stable -->
      <rect x="112" y="0" width="48" height="40" rx="6" fill="#16A34A"/>
      <text x="112" y="52" font-size="10" font-weight="700" fill="#16A34A">Stable</text>

      <!-- Pending -->
      <rect x="168" y="0" width="48" height="40" rx="6" fill="#64748B"/>
      <text x="168" y="52" font-size="10" font-weight="700" fill="#64748B">Pending</text>

      <!-- AI Assisted -->
      <rect x="224" y="0" width="48" height="40" rx="6" fill="#7C3AED"/>
      <text x="224" y="52" font-size="10" font-weight="700" fill="#7C3AED">AI Assist</text>
    </g>
  </g>

  <!-- =====================================================================
       SECTION 2: BUTTON SYSTEM & VARIANTS
       ===================================================================== -->
  <g transform="translate(48, 200)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A">2. Button System &amp; Variants</text>
    
    <g transform="translate(0, 20)">
      <!-- Primary Button -->
      <rect x="0" y="0" width="140" height="40" rx="8" fill="#1D4ED8"/>
      <text x="28" y="25" font-size="14" font-weight="600" fill="#FFFFFF">Primary Action</text>

      <!-- Secondary / Outlined -->
      <rect x="156" y="0" width="140" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="176" y="25" font-size="14" font-weight="600" fill="#334155">Secondary</text>

      <!-- Destructive / Critical -->
      <rect x="312" y="0" width="140" height="40" rx="8" fill="#DC2626"/>
      <text x="336" y="25" font-size="14" font-weight="600" fill="#FFFFFF">Destructive</text>

      <!-- Ghost / Tertiary -->
      <rect x="468" y="0" width="110" height="40" rx="8" fill="#F1F5F9"/>
      <text x="502" y="25" font-size="14" font-weight="600" fill="#475569">Ghost</text>

      <!-- Disabled Button -->
      <rect x="594" y="0" width="120" height="40" rx="8" fill="#E2E8F0"/>
      <text x="626" y="25" font-size="14" font-weight="600" fill="#94A3B8">Disabled</text>

      <!-- Loading State -->
      <rect x="730" y="0" width="140" height="40" rx="8" fill="#1D4ED8" opacity="0.85"/>
      <circle cx="750" cy="20" r="7" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 6"/>
      <text x="766" y="25" font-size="13" font-weight="600" fill="#FFFFFF">Processing...</text>
    </g>
  </g>

  <!-- =====================================================================
       SECTION 3: CLINICAL STATUS BADGES & ROLE TAGS
       ===================================================================== -->
  <g transform="translate(48, 300)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A">3. Status Badges &amp; Role Tags</text>
    
    <g transform="translate(0, 20)">
      <!-- Critical Badge -->
      <rect x="0" y="0" width="110" height="26" rx="13" fill="#FEF2F2" stroke="#FECACA"/>
      <circle cx="12" cy="13" r="4" fill="#DC2626"/>
      <text x="24" y="17" font-size="11" font-weight="700" fill="#991B1B">CRITICAL STAT</text>

      <!-- Urgent Badge -->
      <rect x="122" y="0" width="90" height="26" rx="13" fill="#FFF7ED" stroke="#FED7AA"/>
      <circle cx="134" cy="13" r="4" fill="#EA580C"/>
      <text x="146" y="17" font-size="11" font-weight="700" fill="#9A3412">URGENT</text>

      <!-- Stable Badge -->
      <rect x="224" y="0" width="90" height="26" rx="13" fill="#F0FDF4" stroke="#BBF7D0"/>
      <circle cx="236" cy="13" r="4" fill="#16A34A"/>
      <text x="248" y="17" font-size="11" font-weight="700" fill="#166534">STABLE</text>

      <!-- Pending Badge -->
      <rect x="326" y="0" width="90" height="26" rx="13" fill="#F8FAFC" stroke="#E2E8F0"/>
      <circle cx="338" cy="13" r="4" fill="#64748B"/>
      <text x="350" y="17" font-size="11" font-weight="700" fill="#475569">PENDING</text>

      <!-- AI-Generated Badge -->
      <rect x="428" y="0" width="130" height="26" rx="13" fill="#F5F3FF" stroke="#DDD6FE"/>
      <text x="440" y="17" font-size="11" font-weight="700" fill="#6D28D9">✨ AI-GENERATED</text>

      <!-- Role Tag: Physician -->
      <rect x="570" y="0" width="86" height="26" rx="6" fill="#EFF6FF"/>
      <text x="580" y="17" font-size="11" font-weight="700" fill="#1D4ED8">PHYSICIAN</text>

      <!-- Role Tag: Nurse -->
      <rect x="668" y="0" width="68" height="26" rx="6" fill="#F0FDF4"/>
      <text x="678" y="17" font-size="11" font-weight="700" fill="#166534">NURSE</text>

      <!-- Role Tag: Security Admin -->
      <rect x="748" y="0" width="124" height="26" rx="6" fill="#FEF2F2"/>
      <text x="758" y="17" font-size="11" font-weight="700" fill="#991B1B">SECURITY ADMIN</text>
    </g>
  </g>

  <!-- =====================================================================
       SECTION 4: FORM INPUT COMPONENTS
       ===================================================================== -->
  <g transform="translate(48, 390)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A">4. Form Input States</text>
    
    <g transform="translate(0, 20)">
      <!-- Default Text Input -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" font-size="12" font-weight="600" fill="#334155">Patient MRN (Default)</text>
        <rect x="0" y="10" width="240" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="14" y="36" font-size="14" font-weight="400" fill="#0F172A">HOS-92841</text>
      </g>

      <!-- Focused Input -->
      <g transform="translate(260, 0)">
        <text x="0" y="0" font-size="12" font-weight="600" fill="#1D4ED8">Email Address (Focused)</text>
        <rect x="0" y="10" width="240" height="42" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
        <text x="14" y="36" font-size="14" font-weight="400" fill="#0F172A">sarah.chen@hospital.os</text>
      </g>

      <!-- Error State Input -->
      <g transform="translate(520, 0)">
        <text x="0" y="0" font-size="12" font-weight="600" fill="#DC2626">Dosage Amount (Error)</text>
        <rect x="0" y="10" width="240" height="42" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
        <text x="14" y="36" font-size="14" font-weight="400" fill="#0F172A">-5 mg</text>
        <text x="0" y="66" font-size="11" font-weight="500" fill="#DC2626">Must be a valid positive numerical dosage.</text>
      </g>

      <!-- Select Dropdown -->
      <g transform="translate(780, 0)">
        <text x="0" y="0" font-size="12" font-weight="600" fill="#334155">Department (Select)</text>
        <rect x="0" y="10" width="240" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="14" y="36" font-size="14" font-weight="500" fill="#0F172A">Cardiology OPD</text>
        <path d="M216 28L222 34L228 28" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- =====================================================================
       SECTION 5: DATA TABLE PRIMITIVES & DIALOGS
       ===================================================================== -->
  <g transform="translate(48, 510)">
    <text x="0" y="0" font-size="16" font-weight="700" fill="#0F172A">5. Confirmation Modal &amp; Dialog Standard</text>
    
    <!-- Modal Preview Frame -->
    <g transform="translate(0, 20)">
      <rect width="480" height="240" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- Modal Header -->
      <circle cx="36" cy="36" r="16" fill="#FEE2E2"/>
      <path d="M36 28V36M36 40V41" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
      <text x="64" y="34" font-size="16" font-weight="700" fill="#0F172A">Authorize Patient Discharge?</text>
      <text x="64" y="52" font-size="13" font-weight="400" fill="#64748B">Patient: Rajesh Kumar • MRN-92841</text>

      <text x="24" y="90" font-size="13" font-weight="400" fill="#334155" line-height="20">
        You are about to authorize the clinical discharge summary. This will transition the encounter to Discharged status and emit a signed audit record.
      </text>

      <!-- Checkbox Confirm -->
      <rect x="24" y="140" width="16" height="16" rx="4" fill="#2563EB"/>
      <path d="M27 148L30 151L37 144" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <text x="48" y="153" font-size="12" font-weight="500" fill="#0F172A">I have verified all pending lab results and clinical orders.</text>

      <!-- Actions -->
      <rect x="260" y="180" width="90" height="38" rx="8" fill="#F1F5F9"/>
      <text x="286" y="204" font-size="13" font-weight="600" fill="#475569">Cancel</text>

      <rect x="360" y="180" width="100" height="38" rx="8" fill="#1D4ED8"/>
      <text x="378" y="204" font-size="13" font-weight="600" fill="#FFFFFF">Authorize</text>
    </g>
  </g>
</svg>
